name: Build ESP-IDF Project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: esp-idf build
      uses: espressif/idf-build-action@v1
      with:
        esp_idf_version: 'v6.0.1' # Change to match your local ESP-IDF version
        target: 'esp32'

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esp32-bw-dac-binaries
        path: |
          build/bootloader/bootloader.bin
          build/partition_table/partition-table.bin
          build/firmware.bin
          build/*.bin
