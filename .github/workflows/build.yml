name: Build ESP-IDF Project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Build Espressif Project
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v6.1
        path: '.' # Change this if your main project is inside a subfolder

    # DEBUG STEP: This will list all files in the terminal logs
    - name: Inspect Workspace Directories
      run: |
        echo "=== Current Directory Content ==="
        ls -la
        echo "=== Checking if Build Folder Exists ==="
        if [ -d "build" ]; then
          echo "Found build folder! Contents:"
          ls -la build/
        else
          echo "Error: build folder does not exist at the root level."
        fi

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esp32-bluetooth-dac-binaries
        path: |
          build/bootloader/bootloader.bin
          build/partition_table/partition-table.bin
          build/**/*.bin
