name: Build ESP-IDF Project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    # The official action automatically handles the Docker environment and leaves the files accessible
    - name: Build Espressif Project
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v6.1

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esp32-bluetooth-dac-binaries
        path: |
          build/bootloader/bootloader.bin
          build/partition_table/partition-table.bin
          build/**/*.bin
